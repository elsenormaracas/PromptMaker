<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR0MPT_MASTER</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💾</text></svg>">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

        :root {
            --p-color: #42ff71;
            --p-glow: 0 0 6px rgba(66, 255, 113, 0.6), 0 0 2px rgba(66, 255, 113, 0.8);
            --bg-faded: #121412; 
        }
        body.theme-amber { 
            --p-color: #ffb000; 
            --p-glow: 0 0 6px rgba(255, 176, 0, 0.6), 0 0 2px rgba(255, 176, 0, 0.8);
            --bg-faded: #14110b; 
        }
        body.theme-white { 
            --p-color: #e0e0e0; 
            --p-glow: 0 0 4px rgba(255, 255, 255, 0.4);
            --bg-faded: #161616; 
        }
        body.theme-red { 
            --p-color: #ff3e3e; 
            --p-glow: 0 0 6px rgba(255, 62, 62, 0.6), 0 0 2px rgba(255, 62, 62, 0.8);
            --bg-faded: #140b0b; 
        }

        body {
            background-color: #000; color: var(--p-color); font-family: 'Fira Code', monospace;
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
            text-shadow: var(--p-glow);
        }

        .crt-monitor {
            width: 100vw; height: 100vh; background: var(--bg-faded); position: relative;
            overflow: hidden; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .crt-monitor { width: 95vw; height: 90vh; max-width: 900px; border: 15px solid #1a1a1a; border-radius: 40px; padding: 40px; }
        }

        .crt-monitor::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 21;
        }

        .noise-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADeST97AAAAB3RSTlMAVVDu/v4AfZ3OAAAARElEQVQ4y2NgQAX8DIxgIAnGZ2AEAzEwHh0tGEiC8ZlQMBCPjhYMJMH4TCgYiEdHCwaSYHwmFAzEo6MFA0kwPhMKBuIRAFidGf9p99vjAAAAAElFTkSuQmCC");
            opacity: 0.1; pointer-events: none; z-index: 25; animation: noise 0.2s infinite;
        }

        @keyframes noise { 0% { transform: translate(0,0); } 50% { transform: translate(-0.5%, 0.5%); } 100% { transform: translate(0,0); } }

        .view-content { position: relative; z-index: 30; display: none; flex-direction: column; height: 100%; animation: flicker 0.2s infinite; }
        @keyframes flicker { 0% { opacity: 0.99; } 50% { opacity: 1; } 100% { opacity: 0.98; } }
        .view-content.active { display: flex; }

        header { border-bottom: 1px solid var(--p-color); margin-bottom: 15px; font-size: 0.7rem; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        .prompt-display { 
            font-size: 1rem; border: 1px solid var(--p-color); padding: 15px; margin: 10px 0; 
            background: rgba(255, 255, 255, 0.02); line-height: 1.5;
        }

        /* Status / feed indicator */
        .feed-status {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feed-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--p-color);
            display: inline-block;
            box-shadow: var(--p-glow);
        }
        .feed-dot.loading {
            animation: blink 0.8s infinite;
        }
        .feed-dot.error {
            background: #ff4757;
            box-shadow: 0 0 6px rgba(255, 71, 87, 0.7);
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }

        /* Scrollable prompt area on home view */
        #prompt-text {
            overflow-y: auto;
            max-height: 200px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt-meta {
            font-size: 0.55rem;
            opacity: 0.5;
            margin-top: 8px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 6px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }
        .prompt-meta a {
            color: var(--p-color);
            text-decoration: none;
            opacity: 0.6;
        }
        .prompt-meta a:hover { opacity: 1; }

        textarea {
            flex-grow: 1; background: rgba(0,0,0,0.2); color: var(--p-color); border: 1px solid var(--p-color);
            padding: 15px; font-family: 'Fira Code', monospace; font-size: 1rem; resize: none; outline: none;
            text-shadow: var(--p-glow); margin-bottom: 15px;
        }

        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            width: 100%;
        }
        
        button {
            background: var(--p-color); color: #000; border: none; padding: 12px 5px;
            font-family: 'Fira Code', monospace; font-weight: bold; cursor: pointer;
            text-transform: uppercase; font-size: 0.7rem;
            white-space: nowrap;
            box-shadow: 0 0 8px var(--p-color); transition: 0.2s;
            overflow: hidden; text-overflow: ellipsis;
        }
        button.secondary { background: transparent; color: var(--p-color); border: 1px solid var(--p-color); box-shadow: none; }
        button.danger { background: transparent; color: #ff4757; border: 1px solid #ff4757; text-shadow: 0 0 5px #ff4757; box-shadow: none; }
        button:hover { filter: brightness(1.2); }
        button:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }

        .archive-item { border: 1px solid var(--p-color); margin-bottom: 8px; cursor: pointer; }
        .archive-header { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
        .log-date { font-size: 0.6rem; opacity: 0.7; }
        .log-prompt { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .archive-body { padding: 15px; display: none; font-size: 0.85rem; border-top: 1px dashed var(--p-color); background: rgba(0,0,0,0.4); }
        .archive-item.open .archive-body { display: block; }

        .timer { font-size: 2.2rem; text-align: center; margin-bottom: 10px; font-weight: bold; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--p-color); }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            font-size: 0.55rem;
            padding: 4px 8px;
            background: transparent;
            color: var(--p-color);
            border: 1px solid var(--p-color);
            box-shadow: none;
            opacity: 0.5;
        }
        .filter-btn.active {
            opacity: 1;
            background: var(--p-color);
            color: #000;
            box-shadow: 0 0 6px var(--p-color);
        }

        /* Prompt count badge */
        .prompt-count {
            font-size: 0.55rem;
            opacity: 0.5;
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div class="crt-monitor">
    <div class="noise-overlay"></div>
    
    <header id="main-header">
        <div>
            [ PR0MPT_MASTER : 5000 ]
            <span class="prompt-count" id="prompt-count-badge"></span>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="secondary" onclick="refreshFeed()" id="refresh-btn" style="padding: 4px 8px; font-size: 0.6rem;" title="Reload from Reddit">[ SYNC ]</button>
            <button class="secondary" onclick="cycleTheme()" style="padding: 4px 8px; font-size: 0.6rem;">[ C0L0R ]</button>
        </div>
    </header>

    <div id="view-home" class="view-content active">
        <!-- Feed status line -->
        <div class="feed-status">
            <span class="feed-dot loading" id="feed-dot"></span>
            <span id="feed-status-text">CONNEXION À R/WRITINGPROMPTS...</span>
        </div>

        <!-- Sorting filters -->
        <div class="filter-bar" id="filter-bar" style="display:none;">
            <button class="filter-btn active" id="filter-hot" onclick="setFilter('hot')">[ HOT ]</button>
            <button class="filter-btn" id="filter-top_day" onclick="setFilter('top_day')">[ TOP/JOUR ]</button>
            <button class="filter-btn" id="filter-top_week" onclick="setFilter('top_week')">[ TOP/SEMAINE ]</button>
            <button class="filter-btn" id="filter-top_all" onclick="setFilter('top_all')">[ TOP/TOUT ]</button>
        </div>

        <div id="prompt-text" class="prompt-display">> CHARGEMENT DU FLUX...</div>
        <div id="prompt-meta-bar" class="prompt-meta" style="display:none;"></div>

        <div class="btn-group" style="margin-top:10px;">
            <button onclick="generatePrompt()" id="gen-btn" disabled>[ N0UVEAU ]</button>
            <button onclick="startSession()" id="start-btn" style="display:none;">[ ÉCRIRE ]</button>
        </div>
    </div>

    <div id="view-writing" class="view-content">
        <div id="writing-prompt-large" class="prompt-display" style="font-size: 0.9rem; border-bottom: 3px double var(--p-color); margin-top:0; max-height:120px; overflow-y:auto;"></div>
        <div class="timer" id="timer-display">10:00</div>
        <textarea id="story-input" spellcheck="false" oninput="countWords()"></textarea>
        <div class="btn-group">
            <button onclick="cancelSession()" class="danger">[ ANNULER ]</button>
            <button onclick="finishEarly()">[ SAUVER ]</button>
        </div>
        <div style="font-size:0.7rem; margin-top: 10px; text-align: right; opacity: 0.7;">
            COMPTE: <span id="word-count">0</span> MOTS
        </div>
    </div>

    <div id="view-history" class="view-content">
        <h2 style="font-size: 1rem; display: flex; justify-content: space-between; margin: 0 0 10px 0;"> 
            <span>> ARCHIVES</span>
            <button class="danger" onclick="clearArchives()" style="flex:none; padding: 4px 8px; font-size: 0.6rem;">[ PURGE ]</button>
        </h2>
        <div id="history-list" style="overflow-y: auto; flex-grow: 1;"></div>
        <div style="margin-top: 15px;">
            <button onclick="showView('view-home')" style="width:100%;">[ RETURN_TO_ROOT ]</button>
        </div>
    </div>

    <footer id="main-footer" style="margin-top: auto; padding-top: 15px;">
        <button onclick="showHistory()" class="secondary" style="width:100%; padding: 10px; font-size: 0.7rem;">./list_archives</button>
    </footer>
</div>

<script>
    // ─── STATE ────────────────────────────────────────────────────────────────
    let promptsPool = [];           // fetched prompts
    let currentPrompt = null;       // { content, upvotes, author, url }
    let timerInterval = null;
    let timeLeft = 600;
    let currentTheme = 0;
    let currentFilter = 'hot';
    let seenIds = new Set();        // avoid repeating prompts in a session

    // ─── REDDIT FETCH ─────────────────────────────────────────────────────────
    const REDDIT_ENDPOINTS = {
        hot:      'https://www.reddit.com/r/WritingPrompts/hot.json?limit=100',
        top_day:  'https://www.reddit.com/r/WritingPrompts/top.json?limit=100&t=day',
        top_week: 'https://www.reddit.com/r/WritingPrompts/top.json?limit=100&t=week',
        top_all:  'https://www.reddit.com/r/WritingPrompts/top.json?limit=100&t=all',
    };

    // Tags we want (only actual writing prompts, not meta/off-topic)
    const VALID_TAGS = ['[WP]', '[SP]', '[CW]', '[EU]', '[TT]', '[MP]'];

    function setDot(state) {
        const dot = document.getElementById('feed-dot');
        dot.classList.remove('loading', 'error');
        if (state === 'loading') dot.classList.add('loading');
        if (state === 'error')   dot.classList.add('error');
    }

    async function fetchFromReddit(filter) {
        const url = REDDIT_ENDPOINTS[filter];
        // Try direct Reddit JSON first, fall back to proxy
        const endpoints = [
            url,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        for (const endpoint of endpoints) {
            try {
                const res = await fetch(endpoint, {
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-cache'
                });
                if (!res.ok) continue;
                const data = await res.json();
                return data;
            } catch (e) {
                // try next
            }
        }
        return null;
    }

    function parseRedditData(data) {
        if (!data || !data.data || !data.data.children) return [];

        return data.data.children
            .map(child => child.data)
            .filter(post => {
                // must have a valid [TAG] prefix
                const title = post.title || '';
                return VALID_TAGS.some(tag => title.startsWith(tag));
            })
            .map(post => {
                // Strip the tag and clean up the title
                let title = post.title;
                const tagMatch = title.match(/^\[(WP|SP|CW|EU|TT|MP)\]\s*/i);
                const tag = tagMatch ? `[${tagMatch[1].toUpperCase()}]` : '';
                const content = title.replace(/^\[(WP|SP|CW|EU|TT|MP)\]\s*/i, '').trim();

                return {
                    id: post.id,
                    content: content,
                    tag: tag,
                    upvotes: post.ups,
                    author: post.author,
                    url: `https://reddit.com${post.permalink}`,
                    created: post.created_utc,
                };
            })
            .filter(p => p.content.length > 20); // filter out stub posts
    }

    async function loadFeed(filter) {
        setDot('loading');
        document.getElementById('feed-status-text').textContent = `SYNC R/WRITINGPROMPTS [${filter.toUpperCase()}]...`;
        document.getElementById('gen-btn').disabled = true;
        document.getElementById('filter-bar').style.display = 'none';
        document.getElementById('prompt-text').textContent = '> CHARGEMENT DU FLUX...';
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('prompt-meta-bar').style.display = 'none';

        const data = await fetchFromReddit(filter);
        const parsed = data ? parseRedditData(data) : [];

        if (parsed.length === 0) {
            setDot('error');
            document.getElementById('feed-status-text').textContent = `ERREUR: FLUX INACCESSIBLE`;
            document.getElementById('prompt-text').textContent =
                '> IMPOSSIBLE DE CONTACTER REDDIT.\n> Vérifie ta connexion internet.';
            document.getElementById('gen-btn').disabled = true;
            return;
        }

        promptsPool = parsed;
        seenIds.clear();

        setDot('ok');
        document.getElementById('feed-status-text').textContent =
            `FLUX OK — ${parsed.length} PR0MPTS CHARGÉS`;
        document.getElementById('filter-bar').style.display = 'flex';
        document.getElementById('gen-btn').disabled = false;

        const badge = document.getElementById('prompt-count-badge');
        badge.textContent = `[${parsed.length}]`;

        // Auto-load first prompt
        generatePrompt();
    }

    // ─── FILTER ───────────────────────────────────────────────────────────────
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`filter-${filter}`).classList.add('active');
        loadFeed(filter);
    }

    async function refreshFeed() {
        const btn = document.getElementById('refresh-btn');
        btn.textContent = '[ ... ]';
        btn.disabled = true;
        await loadFeed(currentFilter);
        btn.textContent = '[ SYNC ]';
        btn.disabled = false;
    }

    // ─── PROMPT SELECTION ─────────────────────────────────────────────────────
    function generatePrompt() {
        if (!promptsPool.length) return;

        // Pick unseen prompts first; reset if all seen
        let unseen = promptsPool.filter(p => !seenIds.has(p.id));
        if (unseen.length === 0) { seenIds.clear(); unseen = promptsPool; }

        const pick = unseen[Math.floor(Math.random() * unseen.length)];
        seenIds.add(pick.id);
        currentPrompt = pick;

        const tag = pick.tag ? `${pick.tag} ` : '';
        document.getElementById('prompt-text').textContent = `> ${tag}${pick.content}`;

        // Meta bar
        const metaBar = document.getElementById('prompt-meta-bar');
        metaBar.style.display = 'flex';
        metaBar.innerHTML = `
            <span>▲ ${pick.upvotes.toLocaleString()} | u/${pick.author}</span>
            <a href="${pick.url}" target="_blank" rel="noopener">[ VOIR SUR REDDIT ↗ ]</a>
        `;

        document.getElementById('start-btn').style.display = 'block';
    }

    // ─── SESSION ──────────────────────────────────────────────────────────────
    function startSession() {
        showView('view-writing');
        const tag = currentPrompt.tag ? `${currentPrompt.tag} ` : '';
        document.getElementById('writing-prompt-large').textContent = `> ${tag}${currentPrompt.content}`;
        document.getElementById('story-input').value = '';
        document.getElementById('story-input').focus();
        startTimer();
    }

    function cancelSession() {
        if (confirm('ABORT?')) { clearInterval(timerInterval); showView('view-home'); }
    }

    function countWords() {
        const text = document.getElementById('story-input').value.trim();
        document.getElementById('word-count').textContent = text ? text.split(/\s+/).length : 0;
    }

    function startTimer() {
        timeLeft = 600; updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--; updateTimerDisplay();
            if (timeLeft <= 0) saveStory();
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer-display').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function finishEarly() { if (confirm('ENREGISTRER?')) saveStory(); }

    function saveStory() {
        clearInterval(timerInterval);
        const text = document.getElementById('story-input').value;
        if (text.length < 5) return showView('view-home');
        const now = new Date();
        const timestamp = `${now.toLocaleDateString()} @ ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        const history = JSON.parse(localStorage.getItem('pRetroFinal_v12') || '[]');
        history.unshift({
            timeLabel: timestamp,
            prompt: currentPrompt.content,
            tag: currentPrompt.tag || '',
            upvotes: currentPrompt.upvotes,
            author: currentPrompt.author,
            url: currentPrompt.url,
            text: text
        });
        localStorage.setItem('pRetroFinal_v12', JSON.stringify(history));
        showHistory();
    }

    // ─── HISTORY ──────────────────────────────────────────────────────────────
    function showHistory() {
        showView('view-history');
        const list = document.getElementById('history-list');
        const history = JSON.parse(localStorage.getItem('pRetroFinal_v12') || '[]');
        list.innerHTML = history.length ? history.map((item) => `
            <div class="archive-item" onclick="toggleArchive(this)">
                <div class="archive-header">
                    <span class="log-date">[ENREGSTR: ${item.timeLabel}] ${item.tag || ''} ▲${(item.upvotes || 0).toLocaleString()}</span>
                    <span class="log-prompt">> ${item.prompt}</span>
                </div>
                <div class="archive-body" onclick="event.stopPropagation()">
                    <div style="margin-bottom:15px; line-height:1.6;">${item.text.replace(/\n/g, '<br>')}</div>
                    <div style="display:flex; gap:8px;">
                        <button class="secondary" style="flex:1; font-size:0.6rem;" onclick="copyText(this)">[ C0PIER ]</button>
                        ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener" style="flex:1;"><button class="secondary" style="width:100%; font-size:0.6rem;">[ SOURCE ↗ ]</button></a>` : ''}
                    </div>
                </div>
            </div>
        `).join('') : '> ARCHIVES_INTROUVABLES';
    }

    function toggleArchive(el) { el.classList.toggle('open'); }

    function copyText(btn) {
        const text = btn.parentElement.previousElementSibling.innerText;
        navigator.clipboard.writeText(text).then(() => {
            const original = btn.innerText; btn.innerText = '[ C0PIÉ! ]';
            setTimeout(() => btn.innerText = original, 2000);
        });
    }

    function clearArchives() {
        if (confirm('RESET?')) { localStorage.removeItem('pRetroFinal_v12'); showHistory(); }
    }

    // ─── UI HELPERS ───────────────────────────────────────────────────────────
    function showView(viewId) {
        document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        const isWriting = (viewId === 'view-writing');
        document.getElementById('main-header').style.display = isWriting ? 'none' : 'flex';
        document.getElementById('main-footer').style.display = isWriting ? 'none' : 'block';
    }

    function cycleTheme() {
        const body = document.body;
        currentTheme = (currentTheme + 1) % 4;
        body.classList.remove('theme-amber', 'theme-white', 'theme-red');
        if (currentTheme === 1) body.classList.add('theme-amber');
        if (currentTheme === 2) body.classList.add('theme-white');
        if (currentTheme === 3) body.classList.add('theme-red');
    }

    // ─── BOOT ─────────────────────────────────────────────────────────────────
    loadFeed('hot');
</script>
</body>
</html>
